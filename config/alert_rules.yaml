alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 2000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202603679
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: request_failed / request_received * 100 > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202603679
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessDegraded
    severity: warning
    condition: tool_success == true rate < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202603679
    runbook: docs/alerts.md#alert-3
